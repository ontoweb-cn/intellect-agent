name: Rust CI

# Full Rust pipeline: unit tests, PyO3 build, wheel packaging, and Python-level
# verification (parity, sandbox, AST, token). Split into three concurrent jobs
# so pure-Rust failures surface in ~3 min instead of waiting for the full build.

on:
  push:
    branches: [main]
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-ci.yml'

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Pure Rust unit tests (no Python, no PyO3 linking) ────────────
  # Fastest path — finishes in ~3 min. Runs in parallel with rust-full.
  rust-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Run Rust unit tests (no Python linking)
        run: |
          cd rust-core
          # Serial on purpose. Under --no-default-features pyo3 has no
          # auto-initialize, so the first test that touches Python (via
          # error_classifier's with_gil) races pyo3's lazy
          # prepare_freethreaded_python() and trips its "interpreter is not
          # initialized" assert — which aborts the whole process, hiding the
          # real per-test results. Enabling auto-initialize clears that race
          # but exposes a second one: backend.rs's temp_db_path() keys only on
          # the process id, so parallel tests share one DB file and stomp on
          # each other. The suite takes ~0.15s, so serializing costs nothing.
          cargo test --no-default-features -- --test-threads=1
          echo "Rust unit tests (pure): OK"

      - name: Assert minimum Rust test count
        # Hardened in the same pass as tests.yml's rust gate. This one passed
        # because the count is a single line, but `grep -c` prints `0` *and*
        # exits 1, so `|| echo 0` would have produced the two-line value
        # "0\n0" and a SyntaxError rather than an assertion the moment the
        # suite collected nothing. Pass the count via argv so a stray newline
        # cannot corrupt the program, and keep `|| true` so `set -e` does not
        # abort before the assertion can report.
        run: |
          cd rust-core
          COUNT=$(cargo test --no-default-features -- --list 2>&1 | grep -c ': test$' || true)
          echo "Rust test count: $COUNT"
          python3 -c 'import sys
          count = int(sys.argv[1])
          assert count >= 84, f"Expected >= 84 Rust tests, got {count}"
          print(f"Test count assertion: OK ({count} tests)")' "$COUNT"

  # ── Job 2: PyO3 extension tests + wheel build ───────────────────────────
  # Runs in parallel with rust-unit. Builds the release wheel for downstream
  # Python verification.
  rust-full:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      # NOTE: deliberately no `cargo test` step here.  With the default features
      # (extension-module) pyo3 does NOT link libpython — the host interpreter
      # supplies those symbols at runtime — so building a *test binary* fails to
      # link with "undefined symbol: PyExc_TypeError" and friends.  Test
      # binaries are only linkable with --no-default-features, which is exactly
      # what the rust-unit job runs.  This job exists to produce the wheel that
      # rust-python-verify consumes.

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install maturin
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install maturin

      - name: Build release wheel
        run: |
          source .venv/bin/activate
          cd rust-core
          maturin build --release
          echo "Wheel built: $(ls target/wheels/*.whl)"

      - name: Upload Rust wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: intellect-community-core-wheel
          path: rust-core/target/wheels/*.whl
          retention-days: 7

  # ── Job 3: Python-level verification ────────────────────────────────────
  # Depends on rust-full for the wheel artifact. Runs parity tests and
  # validates sandbox / AST / token logic end-to-end through the PyO3 bridge.
  rust-python-verify:
    runs-on: ubuntu-latest
    needs: rust-full
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Download Rust wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: intellect-community-core-wheel
          path: rust-core/target/wheels/

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          # The verify steps run pytest and import the project, so install the
          # project (+ dev extras) rather than a hand-picked trio — the old
          # `maturin pyyaml python-dotenv` list left pytest missing entirely,
          # which the job never reached because the build step failed first.
          uv pip install -e ".[dev]"

      - name: Install Rust extension from the built wheel
        # Consume the release wheel rust-full already produced instead of
        # rebuilding, so this job verifies the artifact that actually ships.
        # Installing it lands the module in site-packages, but the repo's own
        # intellect_community_core/ directory shadows that when running from
        # the repo root (cwd is sys.path[0]), so the .so must also be copied
        # into the source tree — scripts/sync_rust_extension.sh is the repo's
        # helper for exactly this (HP-205e). Without the sync the handshake
        # below dies with ModuleNotFoundError:
        # intellect_community_core.intellect_community_core.
        run: |
          source .venv/bin/activate
          uv pip install rust-core/target/wheels/*.whl
          bash scripts/sync_rust_extension.sh

      - name: Binding handshake smoke test (P0-1)
        run: |
          source .venv/bin/activate
          cd rust-core/..
          python -c "
          import warnings
          with warnings.catch_warnings():
              warnings.simplefilter('error')  # any mismatch warning fails the build
              import intellect_community_core as c
          v = c.RUST_CORE_VERSION
          expected = open('rust-core/Cargo.toml').read().split('version = \"', 1)[1].split('\"', 1)[0]
          assert v == expected, f'binding handshake mismatch: ext={v!r} cargo={expected!r}'
          print(f'binding handshake OK: {v}')
          "

      - name: Run Rust parity tests
        run: |
          source .venv/bin/activate
          cd rust-core/..
          PYTHONPATH=. python -m pytest tests/intellect_state/test_rust_parity.py -v
          # Assert minimum parity test count (prevents silent regression)
          COUNT=$(PYTHONPATH=. python -m pytest tests/intellect_state/test_rust_parity.py --collect-only -q 2>&1 | grep -c 'test_')
          python3 -c "assert $COUNT >= 45, f'Expected >= 45 parity tests, got {$COUNT}'"
          echo "Parity test count: $COUNT OK"

      - name: Verify sandbox patterns
        run: |
          source .venv/bin/activate
          cd rust-core/..
          PYTHONPATH=. python -c "
          # `_HAS_RUST_SANDBOX` was deleted from tools/approval.py in 4d3c9f9
          # (2026-06-13); this workflow was written six days later against the
          # old name, so the import raised ImportError and this step never
          # passed.  The flag now lives in intellect_rust as HAS_SANDBOX.
          from intellect_rust import HAS_SANDBOX, rust_detect_hardline, rust_detect_dangerous
          from tools.approval import _normalize_command_for_detection
          assert HAS_SANDBOX, 'Rust sandbox not loaded'
          n = _normalize_command_for_detection('rm -rf /').lower()
          assert rust_detect_hardline(n) is not None
          n = _normalize_command_for_detection('echo hello').lower()
          assert rust_detect_dangerous(n) is None
          print('Sandbox patterns OK')
          "

      - name: Verify AST code checker
        run: |
          source .venv/bin/activate
          cd rust-core/..
          PYTHONPATH=. python -c "
          from tools.approval import _check_python_ast

          # Dangerous code must be caught
          assert _check_python_ast('import os; os.system(\"id\")') is not None, 'os.system not caught'
          assert _check_python_ast('exec(\"id()\")') is not None, 'exec not caught'
          assert _check_python_ast('import pickle; pickle.loads(b\"...\")') is not None, 'pickle not caught'
          assert _check_python_ast('import ctypes; ctypes.CDLL(\"libc.so.6\")') is not None, 'ctypes not caught'

          # Obfuscation must be caught
          assert _check_python_ast('import builtins; getattr(builtins, \"exec\")(\"id()\")') is not None, 'getattr not caught'
          assert _check_python_ast('import os; os.__dict__[\"system\"](\"id\")') is not None, '__dict__ not caught'
          assert _check_python_ast('import importlib; importlib.import_module(\"os\").system(\"id\")') is not None, 'importlib not caught'

          # Safe code must pass
          assert _check_python_ast('print(\"hello\")') is None, 'safe print false positive'
          assert _check_python_ast('import json; print(json.dumps({\"a\":1}))') is None, 'safe json false positive'
          assert _check_python_ast('x = [i**2 for i in range(10)]') is None, 'safe comprehension false positive'

          print('AST checker OK (7 dangerous caught, 3 safe passed)')
          "

      - name: Verify token descriptions (B1)
        run: |
          source .venv/bin/activate
          cd rust-core/..
          PYTHONPATH=. python -c "
          import intellect_community_core as icc

          # Each token should return a distinct, specific description
          result = icc.detect_dangerous_command_rs('python -c \"exec(\\\"id()\\\")\"')
          assert result is not None and 'exec()' in result[0], f'Bad exec desc: {result}'

          result = icc.detect_dangerous_command_rs('python -c \"import os; os.system(\\\"id\\\")\"')
          assert result is not None and 'os.system()' in result[0], f'Bad os.system desc: {result}'

          result = icc.detect_dangerous_command_rs('python -c \"import ctypes; ctypes.CDLL(\\\"libc.so.6\\\")\"')
          assert result is not None and 'ctypes' in result[0], f'Bad ctypes desc: {result}'

          # Benign must pass
          assert icc.detect_dangerous_command_rs('python -c \"print(1)\"') is None

          print('Token descriptions OK')
          "

  # ── Job 4: Security audit (cargo-audit) ──────────────────────────────
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo-audit
        run: cd rust-core && cargo audit

  # ── Job 5: Supply chain (cargo-deny) ─────────────────────────────────
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo-deny
        run: cd rust-core && cargo deny check
