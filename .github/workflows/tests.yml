name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust extension ───────────────────────────────────────────────────────
  # The intellect_community_core native extension has been a *mandatory*
  # runtime dependency since v0.6.2, but it is NOT a declared pyproject
  # dependency — the build backend is setuptools, maturin only supplies the
  # [tool.maturin] config for manual builds — so `uv pip install -e
  # ".[all,dev]"` never produced it. Every Python test job therefore ran with
  # each `*_rs` symbol bound to None, and ~1900 tests failed with
  # `TypeError: 'NoneType' object is not callable`. tests/intellect_state/
  # test_rust_parity.py is the tell: 58 failures in CI, 58/58 green locally
  # where the extension is built.
  #
  # Build the wheel once here and hand it to the Python jobs below, mirroring
  # the rust-full -> rust-python-verify pattern in rust-ci.yml.
  build-rust-ext:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build release wheel
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install maturin
          cd rust-core
          maturin build --release
          echo "Wheel built: $(ls target/wheels/*.whl)"

      - name: Upload Rust wheel artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: intellect-community-core-wheel
          path: rust-core/target/wheels/*.whl
          retention-days: 7

  test:
    needs: build-rust-ext
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Restore duration cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_durations.json
          # Single stable key. main always overwrites, PRs always find it.
          key: test-durations

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Download Rust extension wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: intellect-community-core-wheel
          path: rust-wheel

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"
          # The native extension is not a pyproject dependency, so install the
          # wheel built by build-rust-ext. Installing it lands the module in
          # site-packages, but the repo's own intellect_community_core/
          # directory shadows that when running from the repo root (cwd is
          # sys.path[0]), so the .so must also be copied into the source tree —
          # scripts/sync_rust_extension.sh is the repo's helper for exactly
          # this (HP-205e). Without the sync every `*_rs` symbol is None again.
          uv pip install rust-wheel/*.whl
          bash scripts/sync_rust_extension.sh

      - name: Run tests (slice ${{ matrix.slice }}/6)
        # Per-file isolation via scripts/run_tests_parallel.py: discovers
        # every test_*.py file under tests/ (excluding integration/ + e2e/),
        # then runs `python -m pytest <file>` in a freshly-spawned subprocess
        # with bounded parallelism. No xdist, no shared workers, no
        # module-level state leakage between files.
        #
        # Why per-file (not per-test): per-test spawn cost (~250ms × 17k
        # tests = 70min CPU minimum) blew the wall-clock budget. Per-file
        # spawn (~250ms × ~850 files = ~3.5min) fits while still giving
        # every file a fresh interpreter — the only isolation boundary
        # that matters in practice (cross-file leakage was the original
        # flake source; intra-file is the test author's responsibility).
        #
        # Why drop xdist entirely: xdist's persistent workers accumulate
        # state across files, which is exactly the leakage we wanted to
        # fix. ThreadPoolExecutor + subprocess.run is ~60 lines and does
        # the job with cleaner semantics.
        #
        # Matrix slicing (--slice I/N): files are distributed across 6
        # jobs by cached duration (LPT algorithm) so each job gets
        # roughly equal wall time. Without a cache, files default to 2s
        # estimate and get split roughly evenly by count — still correct,
        # just not perfectly balanced.
        run: |
          source .venv/bin/activate
          python scripts/run_tests_parallel.py --slice ${{ matrix.slice }}/6
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          ONTOWEB_API_KEY: ""

      - name: Upload per-slice durations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-durations-slice-${{ matrix.slice }}
          path: test_durations.json
          retention-days: 1

  # Merge per-slice duration data into a single cache, so future runs
  # (including PRs) get balanced slicing.
  save-durations:
    needs: test
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Download all slice durations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: test-durations-slice-*
          path: durations
          merge-multiple: true

      - name: Merge into single durations file
        run: |
          python3 -c "
          import json, glob, os
          merged = {}
          for f in glob.glob('durations/*test_durations.json'):
            with open(f) as fh:
              merged.update(json.load(fh))
          with open('test_durations.json', 'w') as fh:
            json.dump(merged, fh, indent=2, sort_keys=True)
          print(f'Merged {len(merged)} file durations')
          "

      - name: Save merged duration cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: test_durations.json
          key: test-durations

  e2e:
    needs: build-rust-ext
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Download Rust extension wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: intellect-community-core-wheel
          path: rust-wheel

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.12
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"
          uv pip install rust-wheel/*.whl
          bash scripts/sync_rust_extension.sh

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          ONTOWEB_API_KEY: ""

  # NOTE: a ``storage-postgresql`` job used to live here.  It was removed
  # because it could never pass, for two independent reasons — and neither is
  # a missing file that someone forgot to commit:
  #
  #   1. ``uv pip install -e ".[all,dev,db-postgresql]"`` named a
  #      ``db-postgresql`` extra that has never existed in pyproject.toml
  #      (``git log -S db-postgresql -- pyproject.toml`` is empty).
  #   2. ``tests/integration/test_storage_postgresql_smoke.py`` has never
  #      existed either (``git log --diff-filter=A`` is empty for that path).
  #
  # The feature it was meant to cover is gone by policy, not by accident:
  # PostgreSQL storage is gated on ``members.enabled``, and multi-user
  # (members/teams/projects) is permanent WONTFIX — ``validate_config_structure``
  # actively *rejects* ``storage.backend: postgresql`` in single-user mode
  # (see tests/intellect_cli/test_config_validation.py::TestStorageBackendValidation).
  # Re-introduce this job only alongside an actual PostgreSQL storage backend.

  coverage:
    runs-on: ubuntu-latest
    needs: [test, build-rust-ext]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download Rust extension wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: intellect-community-core-wheel
          path: rust-wheel

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov
          # Same mandatory-native-extension gap as the test/e2e jobs: without
          # this the whole suite reports ~1900 spurious NoneType failures.
          pip install rust-wheel/*.whl
          bash scripts/sync_rust_extension.sh

      - name: Run coverage
        run: |
          python -m pytest tests/ -q --cov --cov-report=term --cov-report=json --timeout=30 \
            -m "not integration" \
            --cov-fail-under=0
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          ONTOWEB_API_KEY: ""

      - name: Coverage summary
        run: |
          python -c "
          import json
          with open('coverage.json') as f:
              data = json.load(f)
          pct = data['totals']['percent_covered']
          print(f'## Coverage: {pct:.1f}%')
          " >> $GITHUB_STEP_SUMMARY

  # ── Rust fast gate ───────────────────────────────────────────────────────
  # Runs pure Rust unit tests as a fast gate for every PR.
  # For the full Rust pipeline (PyO3, wheel build, parity, sandbox/AST/token
  # verification), see .github/workflows/rust-ci.yml.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-core/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Run Rust unit tests (fast gate)
        run: |
          cd rust-core
          cargo test --no-default-features -- --test-threads=2
          echo "Rust unit tests (pure): OK"

      - name: Assert minimum Rust test count
        # This step could never pass, for two independent reasons:
        #
        #  1. The pattern was `test .*\.rs:` — cargo's `--list` output prints
        #     `module::path::test_name: test`, with no `.rs` anywhere on the
        #     line. It matched nothing, so COUNT was always 0.
        #  2. The `|| echo 0` then made it worse: `grep -c` prints `0` *and*
        #     exits 1, so the fallback appended a second `0` and COUNT became
        #     the two-line value "0\n0". That newline landed inside the
        #     f-string and python died with `SyntaxError: unterminated string
        #     literal` instead of reporting a count.
        #
        # Fix both: a pattern that matches the actual format, and a count
        # passed to python via argv so neither a newline nor a stray zero can
        # corrupt the program. `|| true` is kept because `grep -c` still exits
        # 1 at zero matches, which `set -e` would turn into a silent abort
        # before the assertion got a chance to explain itself.
        run: |
          cd rust-core
          COUNT=$(cargo test --no-default-features -- --list 2>&1 | grep -c ': test$' || true)
          echo "Rust test count: $COUNT"
          python3 -c 'import sys
          count = int(sys.argv[1])
          assert count >= 84, f"Expected >= 84 Rust tests, got {count}"
          print(f"Test count assertion: OK ({count} tests)")' "$COUNT"