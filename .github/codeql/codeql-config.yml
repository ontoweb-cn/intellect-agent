name: Intellect code scanning

# tests/ and optional-skills/ are not the product trust surface. Scanning
# them flooded the Security tab with path and protocol findings that do not
# ship in the default agent. Production code stays in scope.
paths-ignore:
  - "tests/**"
  - "optional-skills/**"

# py/weak-sensitive-data-hashing: SHA-256/BLAKE2 used as cache keys and
# token fingerprints, not password storage. Exclude repo-wide.
#
# py/clear-text-logging-sensitive-data cannot be path-scoped via
# query-filters (filters select queries, not file paths). Path allowlisting
# for auth / credential / secret / gateway / oauth is applied in
# .github/workflows/codeql.yml via advanced-security/filter-sarif.
query-filters:
  - exclude:
      id: py/weak-sensitive-data-hashing
