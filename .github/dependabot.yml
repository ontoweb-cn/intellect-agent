version: 2
updates:
  # Python dependencies (pip/uv via pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      python-patch:
        update-types:
          - "patch"
      python-minor:
        update-types:
          - "minor"
    ignore:
      # openai 3.x swaps httpx for httpx2 — every custom http_client= injection
      # in run_agent.py must migrate with it. Deliberately deferred, tracked as
      # TODO-014; remove this ignore when that migration lands.
      - dependency-name: "openai"
        versions: [">=3"]

  # Website (Quartz/React) dependencies
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
      - "website"
    groups:
      website-patch:
        update-types:
          - "patch"
    ignore:
      # Docusaurus is pinned to 3.9.2 — see commit 5baac08
      - dependency-name: "@docusaurus/core"
      - dependency-name: "@docusaurus/preset-classic"
      - dependency-name: "@docusaurus/types"
      - dependency-name: "@docusaurus/module-type-aliases"
      - dependency-name: "docusaurus-theme-mermaid"

  # TUI (Ink/React) dependencies
  - package-ecosystem: "npm"
    directory: "/ui-tui"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
      - "ui-tui"
    groups:
      tui-patch:
        update-types:
          - "patch"
    ignore:
      # ink 8 is a double-major rendering-core bump (6 -> 8). Type surface is
      # clean and the suite passes, but wrapping/measurement parity needs a
      # manual TUI smoke pass before adoption (no automated visual gate).
      # Revisit when someone can run `intellect --tui` against ink 8.
      - dependency-name: "ink"
        versions: [">=7"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
