name: intellect-agent

services:
  intellect-agent:
    # Compose 只负责编排；镜像必须先在仓库根目录通过官方 Dockerfile 手动构建。
    image: intellect-agent:0.6.7
    container_name: intellect-agent-0.6.7
    restart: unless-stopped

    # 所有运行参数统一从仓库根目录 .env 读取，不在编排文件中保存真实凭据。
    env_file:
      - ./.env
    environment:
      # 两项均为必填项；缺失时 Compose 在创建容器之前直接报错，避免服务无认证暴露。
      API_SERVER_KEY: ${API_SERVER_KEY:?请先在根目录 .env 中设置 API_SERVER_KEY}
      INTELLECT_WEBUI_PASSWORD: ${INTELLECT_WEBUI_PASSWORD:?请先在根目录 .env 中设置 INTELLECT_WEBUI_PASSWORD}

    # 一个容器同时启动 Agent/Gateway、OpenAI 兼容 API Server 和 WebUI。
    command: ["/opt/intellect/docker/all-in-one.sh"]

    ports:
      - "${API_SERVER_BIND_HOST}:${API_SERVER_PORT}:${API_SERVER_PORT}"
      - "${WEBUI_BIND_HOST}:${WEBUI_PORT}:${INTELLECT_WEBUI_PORT}"

    volumes:
      # 使用官方仓库根目录下既有约定的本地运行目录；两者均被 Git 和镜像构建上下文排除。
      - ./intellect-config:/opt/data
      - ./workspace:/workspace

    healthcheck:
      # 只有 API Server 和 WebUI 两个入口都能响应时，容器才会被标记为 healthy。
      test: ["CMD", "python", "-c", "import os, urllib.request; api=os.getenv('API_SERVER_PORT', '8642'); web=os.getenv('INTELLECT_WEBUI_PORT', '9119'); urllib.request.urlopen(f'http://127.0.0.1:{api}/health', timeout=3); urllib.request.urlopen(f'http://127.0.0.1:{web}/health', timeout=3)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 120s

    # 给 Gateway、WebUI 和 s6-overlay 留出保存会话、停止子进程及回收资源的时间。
    stop_grace_period: 30s
