# Gitleaks configuration for intellect-agent.
#
# Why this file exists: the upstream default ruleset reports 762 findings on
# this tree and every one of them is a non-secret. Without a config the scan
# fails on every push, which is the same as having no scan at all — the goal
# here is a gate that still fires on a real credential.
#
# The findings break down as:
#   622  optional-skills/mlops/training/unsloth/references/*.md
#        Vendored copies of an upstream project's docs; full of example keys
#        and UUIDs. Not our credentials, not scrubbable without corrupting the
#        vendored content.
#    98  tests/** — fixtures. Placeholder shapes like "test-key-1234567890"
#        and "sk-test-12345678" that exist precisely to exercise redaction.
#    34  website/** — documentation placeholders (YOUR_TOKEN, change-me-...,
#        sequential ids like 123456789012345678).
#     8  Source files: public OAuth *client IDs*. Client IDs are not secrets:
#        they are embedded in the client application and are public by protocol
#        design (only the client secret is confidential). Several are already
#        commented as public in the source. Two of them feed the redaction
#        module's own tests.
#
# Verify locally:
#     gitleaks detect --source . --config .gitleaks.toml --redact
# Confirm the gate still works by planting a credential-shaped string in a
# non-allowlisted file (e.g. agent/foo.py) and re-running.

title = "intellect-agent"

[extend]
useDefault = true

[allowlist]
description = "Non-source trees (vendored docs, fixtures, docs) and known-public client IDs."

# Vendored docs, test fixtures, and documentation. Every hit in these trees is
# a placeholder, a copied example, or a fixture built to be redacted.
paths = [
  '''optional-skills/mlops/training/unsloth/references/''',
  '''^tests/''',
  '''^website/''',
]

# OAuth client IDs are public by design. These are the exact values present in
# source, listed so the reason for each is explicit and a NEW value still
# trips the scan.
regexes = [
  '''78257093-7e40-4613-99e0-527b14b39113''',  # MiniMax OAuth client id
  '''b1a00492-073a-47ea-816f-4c329264a828''',  # xAI OAuth client id
  '''f0304373b74a44d2b584a3fb70ca9e56''',      # Qwen OAuth client id
  '''9d1c250a-e61b-44d9-88ed-5944d1962f5e''',  # Anthropic Claude Code public client id
  '''Ov23li8tweQw6odWQebz''',                  # GitHub Copilot public client id
  '''681255809395''',                          # Google gemini-cli public project number
  '''4uHgMPm-1o7Sk-geV6Cu5clXFsxl''',          # google_oauth public client secret segment
  '''cjVigY5qzO86Huf0OWal''',                  # telephony example client id
]

[[rules]]
# The redaction module must contain the private-key pattern it searches for.
id = "private-key"
description = "Private key blocks (redaction module contains the pattern itself)"

  [rules.allowlist]
  description = "agent/redact.py defines the private-key pattern it searches for."
  paths = ['''agent/redact\.py$''']
