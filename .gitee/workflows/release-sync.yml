name: Gitee Release Sync (macOS + Windows)

# Syncs macOS and Windows wheels from GitHub Release to Gitee Release.
# These platforms cannot be cross-compiled from Gitee Go's Linux runners.
# Linux wheels are built natively by release-linux.yml.
#
# This workflow runs alongside release-linux.yml on tag push. It polls
# GitHub for up to 900 s per attempt, with 3 retries (60 s apart).
#
# Requires two secrets configured in Gitee:
#   GITHUB_PAT  — read-only access to the GitHub repo
#   RELEASE_TOKEN — repo-scoped token for creating Gitee releases + uploading assets

triggers:
  push:
    tags:
      - 'v20*'
      - 'v[0-9]*.*'

stages:
  - stage: sync
    displayName: Sync macOS + Windows wheels from GitHub
    jobs:
      - job: sync-platform-wheels
        displayName: Download and publish
        runsOn: ubuntu-latest
        timeoutMinutes: 60
        steps:
          - name: Checkout
            uses: checkout@v1
            with:
              fetchTags: true

          - name: Extract release tag
            run: |
              if [ -n "${GITEE_REF_NAME:-}" ]; then
                TAG="${GITEE_REF_NAME}"
              elif [ -n "${CI_COMMIT_TAG:-}" ]; then
                TAG="${CI_COMMIT_TAG}"
              else
                TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")
              fi
              if [ -z "$TAG" ]; then
                echo "ERROR: cannot determine release tag" >&2
                exit 1
              fi
              echo "RELEASE_TAG=$TAG" >> $GITEE_ENV

          - name: Install Python deps
            run: |
              sudo apt-get update -qq
              sudo apt-get install -y -qq python3 python3-pip
              python3 -m pip install --upgrade pip -q

          - name: Sync macOS + Windows wheels (dual-path: Artifacts → Release)
            env:
              GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
              RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
            run: |
              set -euo pipefail
              SUCCESS=false

              # ═══════════════════════════════════════════════════════════
              # Phase 1: Fast path — download artifacts directly from
              # GitHub Actions (avoids waiting for publish-github-release
              # to create the intermediate GitHub Release).
              # ═══════════════════════════════════════════════════════════
              echo "════ Phase 1: Trying Artifacts API (fast path) ════"
              rm -rf dist/combined 2>/dev/null || true
              mkdir -p dist/combined
              if python3 packaging/scripts/download-github-artifacts.py \
                  --tag "$RELEASE_TAG" \
                  --dist-dir dist/combined \
                  --platforms darwin,windows \
                  --max-wait 1800; then
                echo "✓ Artifacts API download succeeded"
                SUCCESS=true
              else
                echo "✗ Artifacts API path failed (will fall back to Release API)"
              fi

              # ═══════════════════════════════════════════════════════════
              # Phase 2: Fallback — download from GitHub Release
              # (current behavior, with retry).
              # ═══════════════════════════════════════════════════════════
              if [ "$SUCCESS" = false ]; then
                echo "════ Phase 2: Falling back to Release API ════"
                MAX_RETRIES=3
                RETRY_DELAY=60
                for attempt in $(seq 1 $MAX_RETRIES); do
                  echo "=== Release API attempt $attempt/$MAX_RETRIES ==="
                  rm -rf dist/combined 2>/dev/null || true
                  mkdir -p dist/combined
                  if python3 packaging/scripts/download-github-release.py \
                      --tag "$RELEASE_TAG" \
                      --dist-dir dist/combined \
                      --max-wait 900; then
                    echo "✓ Release API download succeeded on attempt $attempt"
                    SUCCESS=true
                    break
                  fi
                  if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                    echo "Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                    sleep "$RETRY_DELAY"
                  fi
                done
              fi

              if [ "$SUCCESS" = false ]; then
                echo "All download paths failed — macOS/Windows wheels not synced (non-fatal)"
                exit 0
              fi

              # ═══════════════════════════════════════════════════════════
              # Post-download: verify, smoke test, publish.
              # ═══════════════════════════════════════════════════════════

              # Verify SHA256SUMS if present (integrity check before publish)
              if [ -f dist/combined/SHA256SUMS ]; then
                echo "Verifying SHA256SUMS..."
                if ! (cd dist/combined && sha256sum -c SHA256SUMS 2>&1 | tail -5); then
                  echo "ERROR: SHA256SUMS verification failed — files may be corrupted" >&2
                  exit 1
                fi
              fi

              # Smoke test: install a wheel and verify it works
              echo "=== Smoke test: verifying downloaded wheels ==="
              PY_WHL=$(ls dist/combined/intellect_agent-*.whl 2>/dev/null | head -1) || PY_WHL=""
              RS_WHL=$(ls dist/combined/intellect_community_core-*.whl 2>/dev/null | head -1) || RS_WHL=""
              if [ -n "$PY_WHL" ] && [ -n "$RS_WHL" ]; then
                pip3 install "$PY_WHL" --no-deps -q 2>&1 || echo "Python wheel install skipped (non-fatal)"
                pip3 install "$RS_WHL" --no-deps -q 2>&1 || echo "Rust wheel install skipped (non-fatal)"
                python3 -c "import intellect_community_core; print('Rust extension: OK')" 2>&1 || echo "Rust import skipped (expected: macOS/Windows .whl cannot load on Linux runner)"
                INSTALLED_VER=$(python3 -c "from intellect_cli import __version__; print(__version__)" 2>&1) || INSTALLED_VER="(unknown)"
                echo "intellect-agent version: $INSTALLED_VER"
              else
                echo "WARNING: No wheels found for smoke test (non-fatal)"
              fi
              echo "=== Smoke test done ==="

              # Publish to Gitee (includes SHA256SUMS if present)
              python3 packaging/scripts/publish-gitee-from-ci.py \
                --tag "$RELEASE_TAG" \
                --dist-dir dist/combined
              echo "Sync succeeded — published to Gitee Release"
